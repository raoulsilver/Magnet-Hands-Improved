<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnet Hands</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Libraries are bundled locally so the project works offline and on GitHub Pages -->
    <script src="p5.min.js"></script>
    <script src="ml5.min.js"></script>
  </head>
  <body>
    <main id="stage">
      <div id="canvas-holder">
        <div id="status">Starting camera…</div>
      </div>
      <form id="thought-form" autocomplete="off">
        <input
          id="thought-input"
          type="text"
          maxlength="28"
          placeholder="type a thought, press Enter"
          aria-label="Type a word or short phrase and press Enter"
        />
      </form>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
